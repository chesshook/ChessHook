name: Validate backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n vps.sh
          bash -n container.sh
          bash -n container-run.sh
      - name: Check API Python syntax
        run: python3 -m py_compile engine_api.py
