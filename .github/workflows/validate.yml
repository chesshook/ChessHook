name: Validate Codespaces backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n codespace.sh
          bash -n codespace-start.sh
      - name: Check Python syntax
        run: python3 -m py_compile engine_api.py tests/test_engine_api.py tests/fake_stockfish.py
      - name: Validate devcontainer JSON
        run: python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
      - name: Run authenticated API integration tests
        run: python3 -m unittest discover -s tests -v
